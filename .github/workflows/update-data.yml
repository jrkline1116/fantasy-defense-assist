name: Update defense data

on:
  schedule:
    # Times are UTC; Arizona is UTC-7. Odd minutes avoid GitHub's top-of-the-hour rush,
    # and each morning has a backup run in case GitHub delays or skips the first one.
    # A run with no new games makes no commit.
    - cron: '17 12 * * 1,2,5'   # Mon, Tue, Fri 5:17am Arizona
    - cron: '47 14 * * 1,2,5'   # backup, 7:47am Arizona
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/defense.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update defense data"
            git push
          fi

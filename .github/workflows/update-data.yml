name: Update defense data

on:
  schedule:
    - cron: '0 12 * * 2'    # Tuesdays, 5am Arizona time (after Monday Night Football)
    - cron: '0 12 * * 5'    # Fridays, 5am Arizona time (picks up Thursday Night Football)
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/defense.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update defense data"
            git push
          fi

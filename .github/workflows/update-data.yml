name: Update defense data

on:
  schedule:
    # Times are UTC; Arizona is UTC-7. GitHub often starts scheduled runs late (sometimes
    # hours), so each update morning tries five times. A run with no new games commits nothing.
    - cron: '17 12 * * 1,2,5'   # Mon, Tue, Fri  5:17am Arizona
    - cron: '47 13 * * 1,2,5'   #                6:47am
    - cron: '17 15 * * 1,2,5'   #                8:17am
    - cron: '47 16 * * 1,2,5'   #                9:47am
    - cron: '17 18 * * 1,2,5'   #               11:17am
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/build-data.mjs
      - run: node scripts/build-snapshot.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data/defense.json index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update defense data"
            git push
          fi
